# ── Conexión a PostgreSQL en Producción ───────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:joyeria_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Desactivar Consola H2 en Producción
spring.h2.console.enabled=false

# JPA / Hibernate en Producción
# IMPORTANTE: Usamos 'update' para no destruir/limpiar los datos en cada reinicio del servidor.
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL en consola (opcional para debug en producción, por defecto false)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Desactivar AWS Secrets Manager en Producción si se maneja por variables de entorno
spring.cloud.aws.secretsmanager.enabled=false

# Puerto del Servidor
server.port=${PORT:8080}

# ── JWT en Producción ──────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── CORS en Producción ────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://joyeria.webexolink.com}

