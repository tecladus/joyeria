# ── Conexión a PostgreSQL en Producción ───────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_PRIMARY_HOST:localhost}:${DB_PRIMARY_PORT:5432}/${DB_NAME:joyeria_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Desactivar Consola H2 en Producción
spring.h2.console.enabled=false

# JPA / Hibernate en Producción
# update: solo actualiza el esquema, no borra datos
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL en consola (opcional para debug en producción, por defecto false)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── AWS Secrets Manager (Producción) ──────────────────────────────────────
spring.cloud.aws.secretsmanager.enabled=true
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
# Nombre del secreto en AWS: exolink/backend/secrets
spring.config.import=aws-secretsmanager:exolink/backend/secrets

# Puerto del Servidor
server.port=${PORT:8080}

# Ejecutar data-prod.sql después de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true

# ── JWT en Producción ──────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── CORS en Producción ────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://joyeria.webexolink.com}

# ── Configuración de Correo SMTP ──────────────────────────────────────────────
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:service.exolink@gmail.com}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

