# ── Conexión a H2 (Base de Datos en Memoria para Desarrollo) ───────────────────
spring.datasource.url=jdbc:h2:mem:joyeria_db;DB_CLOSE_DELAY=-1
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# Habilitar Consola de H2 en el Navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Desactivar AWS Secrets Manager en Desarrollo Local para evitar errores de credenciales
spring.cloud.aws.secretsmanager.enabled=false

# ── Conexión a MySQL (Original) ────────────────────────────────────────────────
# spring.datasource.url=jdbc:mysql://localhost:3306/joyeria_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=${DB_USER:root}
# spring.datasource.password=${DB_PASSWORD:}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── Hibernate / JPA ───────────────────────────────────────────────────────────
# "create-drop": Limpia y crea la base de datos en cada reinicio (ideal para H2 en memoria)
spring.jpa.hibernate.ddl-auto=update

# Muestra el SQL generado en consola (util para debuggear)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto MySQL 8
# Hibernate 6 detecta el dialecto automaticamente, no es necesario especificarlo

# ── Servidor ──────────────────────────────────────────────────────────────────
server.port=8080

# Ejecutar data.sql después de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true

# ── JWT ───────────────────────────────────────────────────────────────────────
# Clave secreta para firmar los tokens (minimo 256 bits = 32 caracteres)
jwt.secret=${JWT_SECRET:}
# Tiempo de expiracion del token en milisegundos (86400000 = 24 horas)
jwt.expiration=86400000

# ── CORS ──────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173

