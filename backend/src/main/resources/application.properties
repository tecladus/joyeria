# ── Conexión a PostgreSQL ────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_PRIMARY_HOST:localhost}:${DB_PRIMARY_PORT:5432}/${DB_NAME:joyeria_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Desactivar AWS Secrets Manager en Desarrollo Local para evitar errores de credenciales
spring.cloud.aws.secretsmanager.enabled=false

# ── Hibernate / JPA ───────────────────────────────────────────────────────────
# "create-drop": Limpia y crea la base de datos en cada reinicio (ideal para H2 en memoria)
spring.jpa.hibernate.ddl-auto=update

# Muestra el SQL generado en consola (util para debuggear)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto MySQL 8
# Hibernate 6 detecta el dialecto automaticamente, no es necesario especificarlo

# ── Servidor ──────────────────────────────────────────────────────────────────
server.port=8080

# Ejecutar data.sql después de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true

# ── JWT ───────────────────────────────────────────────────────────────────────
# Clave secreta para firmar los tokens (minimo 256 bits = 32 caracteres)
jwt.secret=${JWT_SECRET:}
# Tiempo de expiracion del token en milisegundos (86400000 = 24 horas)
jwt.expiration=86400000

# ── CORS ──────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173

# ── Configuración de Correo SMTP ──────────────────────────────────────────────
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:service.exolink@gmail.com}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

