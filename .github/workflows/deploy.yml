name: Deploy a Producción

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout manual (bypass de actions/checkout)
        run: |
          # Limpiar workspace previo
          shopt -s dotglob nullglob
          rm -rf ./*
          shopt -u dotglob

          # Clonar el repo en el workspace actual
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            .

      - name: Sincronizar Código a Carpeta de Producción
        run: |
          mkdir -p /var/www/temp_facu
          rsync -av --delete --exclude='node_modules' --exclude='target' --exclude='.git' --exclude='logs' --exclude='frontend/dist' ./ /var/www/temp_facu/

      - name: Ejecutar Script de Despliegue Local
        env:
          DEPLOY_PATH: /var/www/temp_facu
          SERVICE_NAME: joyeria-backend
        run: |
          cd /var/www/temp_facu
          chmod +x deploy.sh
          ./deploy.sh